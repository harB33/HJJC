<div class="carousel">
    <div class="carousel-content">
        <a href="./beyond-depth" class="mod bo"><img src="https://drive.google.com/thumbnail?id=1hrl5pqIIwn6UidvFoGVeGk2UI_2CFyrC&sz=s4000" data-index="1"></a>
        <a href="./beyond-depth" class="mod ba"><img src="https://drive.google.com/thumbnail?id=13SEZlW5uB2bpYQdYeZRvCqiGyuUA2K2Q&sz=s4000" data-index="2"></a>
        <a href="./beyond-depth" class="mod bd"><img src="https://drive.google.com/thumbnail?id=1WKzVUzgRO1n7ev2_RVV40dA7WYtJH91y&sz=s4000" data-index="3"></a>
        <a href="./beyond-depth" class="mod bc"><img src="https://drive.google.com/thumbnail?id=1XXUejuBGKv4H7FDc7U1SAsa0UbMwLfEk&sz=s4000" data-index="4"></a>
        <a href="./beyond-depth" class="mod bz"><img src="https://drive.google.com/thumbnail?id=1u6kN3_W0mkTFevDBEyrTXcrHzZwo0F5s&sz=s4000" data-index="5"></a>
        <a href="./beyond-depth" class="mod bn"><img src="https://drive.google.com/thumbnail?id=1vXM0jSFjIomwegwwuGGpX2Mj-xvSmD4C&sz=s4000" data-index="6"></a>
    </div>
    <div class="carousel-buttons">
        <button id="prev"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-big-left-icon lucide-arrow-big-left"><path d="M13 9a1 1 0 0 1-1-1V5.061a1 1 0 0 0-1.811-.75l-6.835 6.836a1.207 1.207 0 0 0 0 1.707l6.835 6.835a1 1 0 0 0 1.811-.75V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1z"/></svg></button>
        <button id="next"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-big-right-icon lucide-arrow-big-right"><path d="M11 9a1 1 0 0 0 1-1V5.061a1 1 0 0 1 1.811-.75l6.836 6.836a1.207 1.207 0 0 1 0 1.707l-6.836 6.835a1 1 0 0 1-1.811-.75V16a1 1 0 0 0-1-1H5a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/></svg></button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    const slides = [...document.querySelectorAll(".carousel-content .mod")];
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const container = document.querySelector(".carousel-content");
    if (!container || slides.length === 0 || !prevBtn || !nextBtn) {
        console.warn("Carousel: missing elements", { container: !!container, slides: slides.length, prev: !!prevBtn, next: !!nextBtn });
        return;
    }

    const order = ["bo","ba","bd","bc","bz","bn"];
    let offset = 0;
    const apply = () => slides.forEach((s,i) => s.className = "mod " + order[(i + offset) % slides.length]);

    const rotate = (dir) => { offset = (offset + dir + slides.length) % slides.length; apply(); };

    nextBtn.onclick = () => rotate(-1);
    prevBtn.onclick = () => rotate(1);

    //swipe
    let startX = 0, lastX = 0, isMoving = false;
    const threshold = 40;
    const maxTime = 800;
    let tStart = 0;

    container.addEventListener("touchstart", (e) => {
        if (!e.touches || !e.touches[0]) return;
        startX = e.touches[0].clientX;
        lastX = startX;
        isMoving = true;
        tStart = Date.now();
    }, {passive: true});

    container.addEventListener("touchmove", (e) => {
        if (!isMoving || !e.touches || !e.touches[0]) return;
        lastX = e.touches[0].clientX;
    }, {passive: true});

    container.addEventListener("touchend", (e) => {
        if (!isMoving) return;
        isMoving = false;
        const dist = lastX - startX;
        const dt = Date.now() - tStart;

        if (Math.abs(dist) > threshold && dt < 2000) {
        if (dist < 0) rotate(-1);
        else rotate(1);
        }
        startX = lastX = 0;
    }, {passive: true});
});
</script>
